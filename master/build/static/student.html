<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>学生管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(120deg, #f4faff 0%, #e2e6f7 100%);
            min-height: 100vh;
        }

        h1 {
            color: #3b5998;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 32px;
        }

        .form-section {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(60, 80, 120, 0.07);
            padding: 32px 24px 24px 24px;
            margin-bottom: 32px;
            max-width: 600px;
        }

        .form-section h2 {
            color: #4d568f;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .form-control:focus {
            border-color: #5e7be8;
            box-shadow: 0 0 0 2px #e2e6f7;
        }

        .form-label {
            font-weight: 500;
            color: #5e7be8;
        }

        #addMsg {
            padding: 12px 0 0 0;
            color: #3b5998;
            font-size: 1.08em;
            font-weight: 500;
        }

        .list-section {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(60, 80, 120, 0.07);
            padding: 24px;
            max-width: 1200px;
        }

        .list-section h2 {
            color: #4d568f;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 18px;
        }

        .table {
            margin-top: 10px;
            border-radius: 8px;
            overflow: hidden;
        }

        .table th {
            background: #e2e6f7;
            color: #3b5998;
            font-weight: 600;
        }

        .table td,
        .table th {
            vertical-align: middle !important;
        }

        .btn-primary {
            background: linear-gradient(90deg, #5e7be8 0%, #7b9fe8 100%);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(90deg, #4a69c8 0%, #5e7be8 100%);
        }

        @media (max-width: 900px) {
            .list-section {
                padding: 10px;
                max-width: 100vw;
            }

            .form-section {
                max-width: 100vw;
            }

            .table th,
            .table td {
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>
    <div class="container mt-4 mb-4">
        <h1 class="text-center">学生管理</h1>

        <!-- 功能1：添加学生信息 -->
        <div class="form-section mx-auto">
            <h2>添加学生</h2>
            <form id="studentForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="name" class="form-label">姓名</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="col-md-6">
                        <label for="birth_date" class="form-label">生日</label>
                        <input type="date" class="form-control" id="birth_date" name="birth_date" required>
                    </div>
                    <div class="col-md-6">
                        <label for="gender" class="form-label">性别</label>
                        <select class="form-select" id="gender" name="gender" required>
                            <option value="male">男</option>
                            <option value="female">女</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="hobby" class="form-label">爱好</label>
                        <input type="text" class="form-control" id="hobby" name="hobby">
                    </div>
                    <div class="col-md-6">
                        <label for="phone_number" class="form-label">手机号</label>
                        <input type="text" class="form-control" id="phone_number" name="phone_number">
                    </div>
                    <div class="col-md-6">
                        <label for="father_name" class="form-label">爸爸名字</label>
                        <input type="text" class="form-control" id="father_name" name="father_name">
                    </div>
                    <div class="col-md-6">
                        <label for="mother_name" class="form-label">妈妈名字</label>
                        <input type="text" class="form-control" id="mother_name" name="mother_name">
                    </div>
                    <div class="col-md-6">
                        <label for="grade" class="form-label">年级</label>
                        <input type="text" class="form-control" id="grade" name="grade">
                    </div>
                    <div class="col-md-6">
                        <label for="class_name" class="form-label">班级</label>
                        <input type="text" class="form-control" id="class_name" name="class_name">
                    </div>
                    <div class="col-md-6">
                        <label for="major" class="form-label">专业</label>
                        <input type="text" class="form-control" id="major" name="major">
                    </div>
                    <div class="col-md-6">
                        <label for="student_id" class="form-label">学生号</label>
                        <input type="text" class="form-control" id="student_id" name="student_id" required>
                    </div>
                </div>
                <div class="mt-4 text-end">
                    <button type="submit" class="btn btn-primary px-4">添加学生</button>
                </div>
            </form>
            <div id="addMsg"></div>
        </div>

        <!-- 功能2：学生列表 -->
        <div class="list-section mx-auto">
            <h2>学生列表</h2>
            <div class="mb-2">
                <button class="btn btn-primary btn-sm" onclick="fetchStudents()">刷新列表</button>
            </div>
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle" id="studentTable">
                    <thead>
                        <tr>
                            <th>姓名</th>
                            <th>生日</th>
                            <th>性别</th>
                            <th>爱好</th>
                            <th>手机号</th>
                            <th>爸爸名字</th>
                            <th>妈妈名字</th>
                            <th>年级</th>
                            <th>班级</th>
                            <th>专业</th>
                            <th>学生号</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- 数据填充 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 表单提交：添加学生
        document.getElementById('studentForm').onsubmit = function (e) {
            e.preventDefault();
            const student = {
                name: document.getElementById('name').value,
                birth_date: document.getElementById('birth_date').value,
                gender: document.getElementById('gender').value,
                hobby: document.getElementById('hobby').value,
                phone_number: document.getElementById('phone_number').value,
                father_name: document.getElementById('father_name').value,
                mother_name: document.getElementById('mother_name').value,
                grade: document.getElementById('grade').value,
                class_name: document.getElementById('class_name').value,
                major: document.getElementById('major').value,
                student_id: document.getElementById('student_id').value,
            };
            fetch('http://127.0.0.1:20080/api/student', {
                method: 'post',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(student)
            })
                .then(response => response.ok ? "添加成功" : "添加失败")
                .then(msg => {
                    document.getElementById('addMsg').innerText = msg;
                    fetchStudents();
                })
                .catch(err => {
                    document.getElementById('addMsg').innerText = "网络错误";
                });
        };

        // 获取学生列表
        function fetchStudents() {
            fetch('http://127.0.0.1:20080/api/student', {
                method: 'get',
                headers: { 'Accept': 'application/json' }
            })
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('studentTable').getElementsByTagName('tbody')[0];
                    tbody.innerHTML = '';
                    data.forEach(s => {
                        const row = tbody.insertRow();
                        row.insertCell().innerText = s.name || '';
                        row.insertCell().innerText = s.birth_date || '';
                        row.insertCell().innerText = s.gender || '';
                        row.insertCell().innerText = s.hobby || '';
                        row.insertCell().innerText = s.phone_number || '';
                        row.insertCell().innerText = s.father_name || '';
                        row.insertCell().innerText = s.mother_name || '';
                        row.insertCell().innerText = s.grade || '';
                        row.insertCell().innerText = s.class_name || '';
                        row.insertCell().innerText = s.major || '';
                        row.insertCell().innerText = s.student_id || '';
                    });
                })
                .catch(() => {
                    const tbody = document.getElementById('studentTable').getElementsByTagName('tbody')[0];
                    tbody.innerHTML = '<tr><td colspan="11">加载失败</td></tr>';
                });
        }

        // 页面加载自动刷新列表
        window.onload = fetchStudents;
    </script>
</body>

</html>
