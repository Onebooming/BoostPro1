    <!-- Content Wrapper. Contains page content -->

        <!-- Content Header (Page header) -->

        <!-- Main content -->

                            </div>
                            <div class="icon">

                            </div>
                            <a href="#" class="small-box-footer" onclick="showEnrollmentManagement()">

                    </div>

                <!-- 统计图表 -->
                <div class="row">
                    <div class="col-md-6">
                        <div class="card">

<!-- jQuery -->
<script src="static/adminlte/plugins/jquery/jquery.min.js"></script>
<!-- Bootstrap 4 -->

<!-- DataTables -->
<script src="static/adminlte/plugins/datatables/jquery.dataTables.min.js"></script>
<script src="static/adminlte/plugins/datatables-bs4/js/dataTables.bootstrap4.min.js"></script>
<!-- ChartJS -->
<script src="static/adminlte/plugins/chart.js/Chart.min.js"></script>
<!-- AdminLTE App -->
<script src="static/adminlte/dist/js/adminlte.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- 自定义JavaScript -->
<script>
// 全局变量
let currentPage = 'dashboard';

// API基础URL
const API_BASE = '/api';

// 页面加载完成后执行
$(document).ready(function() {
    loadDashboardData();
    initCharts();
});

// 加载仪表盘数据
function loadDashboardData() {
    // 模拟数据，实际应该从API获取
    $('#total-students').text('156');
    $('#total-teachers').text('42');
    $('#total-courses').string('28');
    $('#total-enrollments').text('1,234');
}

// 初始化图表
function initCharts() {
    // 学生分布图表
    const studentCtx = document.getElementById('studentChart').getContext('2d');
    new Chart(studentCtx, {
        type: 'doughnut',
        data: {
            labels: ['计算机1班', '计算机2班', '软件工程1班', '软件工程2班'],
            datasets: [{
                data: [30, 25, 28, 20],
                backgroundColor: ['#007bff', '#28a745', '#ffc107', '#dc3545']
            }]
        }
    });

    // 课程类型图表
    const courseCtx = document.getElementById('courseChart').getContext('2d');
    new Chart(courseCtx, {
        type: 'pie',
        data: {
            labels: ['必修课', '选修课', '专业选修'],
            datasets: [{
                data: [15, 8, 5],
                backgroundColor: ['#17a2b8', '#6f42c1', '#e83e8c']
            }]
        }
    });
}

// 显示学生管理页面
function showStudentManagement() {
    updatePageInfo('学生管理', '学生管理');
    loadPage('student');
}

// 显示教师管理页面
function showTeacherManagement() {
    updatePageInfo('教师管理', '教师管理');
    loadPage('teacher');
}

// 显示课程管理页面
function showCourseManagement() {
    updatePageInfo('课程管理', '课程管理');
    loadPage('course');
}

// 显示选课管理页面
function showEnrollmentManagement() {
    updatePageInfo('选课管理', '选课管理');
    loadPage('enrollment');
}

// 显示成绩管理页面
function showGradeManagement() {
    updatePageInfo('成绩管理', '成绩管理');
    loadPage('grade');
}

// 更新页面信息
function updatePageInfo(title, breadcrumb) {
    $('#page-title').text(title);
    $('#breadcrumb-current').text(breadcrumb);
    currentPage = title;
}

// 加载页面内容
function loadPage(pageType) {
    // 这里可以动态加载不同页面的内容
    // 为了演示，我们只显示一个占位符
    const contentHtml = `
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">${getPageTitle(pageType)}</h3>
                <div class="card-tools">
                    <button type="button" class="btn btn-tool" onclick="addNewItem('${pageType}')">
                        <i class="fas fa-plus"></i> 添加
                    </button>
                </div>
            </div>
            <div class="card-body">
                <p>${getPageDescription(pageType)}</p>
                <p>功能正在开发中，敬请期待...</p>
            </div>
        </div>
    `;

    $('#main-content').html(contentHtml);
}

// 获取页面标题
function getPageTitle(pageType) {
    const titles = {
        'student': '学生信息管理',
        'teacher': '教师信息管理',
        'course': '课程信息管理',
        'enrollment': '选课信息管理',
        'grade': '成绩信息管理'
    };
    return titles[pageType] || '管理';
}

// 获取页面描述
function getPageDescription(pageType) {
    const descriptions = {
        'student': '管理学生的基本信息、学籍信息等',
        'teacher': '管理教师的基本信息、授课信息等',
        'course': '管理课程信息、课程安排、教师分配等',
        'enrollment': '管理学生选课、退课、选课统计等',
        'grade': '管理学生成绩、成绩统计、绩点计算等'
    };
    return descriptions[pageType] || '功能管理';
}

// 添加新项目
function addNewItem(type) {
    Swal.fire({
        title: '添加新项目',
        text: '此功能正在开发中',
        icon: 'info',
        confirmButtonText: '确定'
    });
}

// 工具函数：显示成功消息
function showSuccess(message) {
    Swal.fire({
        title: '成功',
        text: message,
        icon: 'success',
        confirmButtonText: '确定'
    });
}

// 工具函数：显示错误消息
function showError(message) {
    Swal.fire({
        title: '错误',
        text: message,
        icon: 'error',
        confirmButtonText: '确定'
    });
}

// 工具函数：显示确认对话框
function showConfirm(message, callback) {
    Swal.fire({
        title: '确认操作',
        text: message,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: '确定',
        cancelButtonText: '取消'
    }).then((result) => {
        if (result.isConfirmed && callback) {
            callback();
        }
    });
}
</script>
</body>
